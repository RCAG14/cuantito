# Publica solo en Cloudflare Pages cada vez que hay un cambio:
#   rama main    -> https://cuantito.pages.dev          (la que usan los clientes)
#   rama pruebas -> https://pruebas.cuantito.pages.dev  (copia para probar, con su propia base de datos)
name: Publicar
on:
  push:
    branches: [main, pruebas]
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
concurrency:
  group: publicar-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Subir a Cloudflare Pages
        run: npx wrangler pages deploy public --project-name cuantito --branch "${GITHUB_REF_NAME}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
